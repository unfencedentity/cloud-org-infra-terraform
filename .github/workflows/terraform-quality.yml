name: Terraform Quality Gate

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (bootstrap/remote-state)
        run: terraform -chdir=bootstrap/remote-state init -backend=false -input=false

      - name: Terraform validate (bootstrap/remote-state)
        run: terraform -chdir=bootstrap/remote-state validate -no-color

      - name: Terraform init (environments/dev)
        run: terraform -chdir=environments/dev init -backend=false -input=false

      - name: Terraform validate (environments/dev)
        run: terraform -chdir=environments/dev validate -no-color
